function grab(n,o={}){
 n.addEventListener('pointerdown',e=>{
  e.preventDefault();n.setPointerCapture(e.pointerId);
  const r=n.getBoundingClientRect(),ox=r.left+r.width/2-e.clientX,oy=r.top+r.height/2-e.clientY;
  const z0=n.style.zIndex;n.style.transition='rotate .2s';n.style.zIndex=35;o.start&&o.start();
  const mv=ev=>{if(n._lock)return;const x=ev.clientX+ox,y=ev.clientY+oy;n.style.left=x+'px';n.style.top=y+'px';o.move&&o.move(x,y)};
  const up=()=>{n.removeEventListener('pointermove',mv);n.removeEventListener('pointerup',up);n.removeEventListener('pointercancel',up);n.style.zIndex=z0;o.end&&o.end(parseFloat(n.style.left),parseFloat(n.style.top))};
  n.addEventListener('pointermove',mv);n.addEventListener('pointerup',up);n.addEventListener('pointercancel',up);
 });
}
function makeBowl(parent,cx,cy,D){
 const b=el(parent,'bowl gr',null,{left:cx+'px',top:cy+'px',width:D+'px',height:D+'px'});
 const bin=el(b,'bin'),bt=el(bin,'bt'),sw=el(bt,'sw'),fc=el(bt,'fc',null,{background:S.cake.bat});
 const yk=S.yk.map(p=>el(bin,'yk',null,{left:p[0]+'%',top:p[1]+'%'}));
 const api={b,bin,bt,sw,fc,yk,
  apply(k=1){bt.style.width=bt.style.height=S.bl*k*100+'%';sw.style.rotate=S.rot+'deg';
   sw.style.opacity=Math.max(0,1-S.mx*1.1);fc.style.opacity=Math.min(1,S.fv*.22+S.mx);
   yk.forEach(y=>y.style.opacity=Math.max(0,1-S.mx*2.2))},
  addYolk(){const p=[rnd(30,58),rnd(30,58)];S.yk.push(p);yk.push(el(bin,'yk',null,{left:p[0]+'%',top:p[1]+'%'}))}};
 api.apply();return api;
}

 const shov=mkTool(`<svg width="130" height="130" viewBox="0 0 130 130"><rect x="6" y="56" width="70" height="14" rx="7" fill="#a16207" transform="rotate(-35 40 63)"/><path d="M62 70 L112 28 Q132 52 112 96 Q90 112 62 70Z" fill="#cbd5e1" stroke="#64748b" stroke-width="5" stroke-linejoin="round"/></svg>`,W*.58,H*.86,{fontSize:'20px'});
 const blob=el(shov,'',null,{position:'absolute',left:'70px',top:'40px',width:'44px',height:'34px',borderRadius:'50%',background:'#7a4e2a',display:'none',pointerEvents:'none',boxShadow:'0 0 0 3px #4b2d16'});
 const hint=el(stage,'hand2','👆',{left:W*.58-20+'px',top:H*.86-20+'px',zIndex:40});
 const [px,py]=P.fromRoot(150,330);
 hint.animate([{translate:'0 0'},{translate:`${sk.x-W*.58}px ${sk.y-H*.86}px`},{translate:`${px-W*.58}px ${py-H*.86}px`}],{duration:2200,iterations:Infinity});
 const inPot=(x,y)=>{const [rx,ry]=P.toRoot(x,y);return rx>20&&rx<280&&ry>150&&ry<430};
 const dec=inc*.95;
 grab(shov,{start:()=>hint.remove(),move:(x,y)=>{
  if(done)return;
  if(!loaded&&Math.hypot(x-sk.x,y-sk.y)<95&&sackLvl()>.03){loaded=true;blob.style.display='block';blob.animate([{scale:'.4'},{scale:'1'}],{duration:200});S.sack=Math.max(0,sackLvl()-dec);sk.set(sackLvl());thump(170,70,.08,.2);nz(.12,{f:700,v:.12})}
  else if(loaded&&inPot(x,y)){
   loaded=false;blob.style.display='none';
   for(let i=0;i<8;i++){const d=el(document.body,'bub','🟤',{left:x+rnd(-26,26)+'px',top:y+'px',fontSize:rnd(14,22)+'px'});setTimeout(()=>d.remove(),900)}
   thump(140,60,.12,.3);nz(.15,{f:500,v:.12});k++;lvl=Math.min(to,lvl+inc);S.potLvl=lvl;P.soil(lvl);
   if(k>=n){done=true;P.soil(to);shov.remove();ding();setTimeout(onDone,600)}}
 }});
}
const potPos=()=>[innerWidth*.37,innerHeight*.4];
/* trascinamento libero: segue il dito 1:1 anche se l'elemento ha scale */
function dragFree(n,o={}){
 n.addEventListener('pointerdown',e=>{
  e.preventDefault();n.setPointerCapture(e.pointerId);
  const l0=parseFloat(n.style.left),t0=parseFloat(n.style.top),sx=e.clientX,sy=e.clientY;const z0=n.style.zIndex;n.style.transition='none';n.style.zIndex=35;o.start&&o.start();
  const mv=ev=>{n.style.left=l0+ev.clientX-sx+'px';n.style.top=t0+ev.clientY-sy+'px';o.move&&o.move()};
  const up=()=>{n.removeEventListener('pointermove',mv);n.removeEventListener('pointerup',up);n.removeEventListener('pointercancel',up);
   const r=n.getBoundingClientRect(),ok=o.end&&o.end(r.left+r.width/2,r.top+r.height/2);n.style.zIndex=z0;
   if(!ok){n.style.transition='left .35s cubic-bezier(.3,1.4,.5,1),top .35s cubic-bezier(.3,1.4,.5,1)';n.style.left=l0+'px';n.style.top=t0+'px'}};
  n.addEventListener('pointermove',mv);n.addEventListener('pointerup',up);n.addEventListener('pointercancel',up);
 });
}

function pourStep(o){

 const P=o.make?o.make():makePlant(S.plant,S.pot,cx,cy,gSc());if(!o.make)P.sway();GP=P;msg(o.msg);
 const tool=mkTool(o.svg,W*.78,H*.8,{fontSize:'20px'});
 const soilY=P.fromRoot(150,300)[1];
 const Z=o.zone?o.zone(P):{over:(sx,sy)=>Math.abs(sx-cx)<110*gSc()+30&&sy<soilY-10&&sy>soilY-300,fall:soilY};
 let p=0,held=false,iv=null,done=false;
 const hint=el(stage,'hand2','👆',{left:W*.78-20+'px',top:H*.8-20+'px',zIndex:40});hint.animate([{translate:'0 0'},{translate:`${cx-W*.78+120}px ${-H*.3}px`}],{duration:1500,iterations:Infinity});
 const bar=el(stage,'',null,{position:'absolute',left:W/2-90+'px',top:'128px',width:'180px',height:'18px',borderRadius:'10px',background:'#ffffffaa',border:'3px solid #fff',overflow:'hidden',zIndex:6});
 const fill=el(bar,'',null,{position:'absolute',left:0,top:0,bottom:0,width:0,background:o.bar});
 grab(tool,{start:()=>{held=true;hint.remove();tool.style.rotate=o.tilt+'deg';iv=setInterval(tick,50);if(o.hose)water(true)},
  move:()=>{},end:()=>{held=false;tool.style.rotate='0deg';clearInterval(iv);IV.delete(iv);water(false)}});
 function spout(){const r=tool.getBoundingClientRect();return[r.left+r.width*.08,r.top+r.height*.3]}
 function tick(){
  if(!held||done)return;const [sx,sy]=spout();
  const over=Z.over(sx,sy);
  for(let i=0;i<(over?3:1);i++)o.drop(sx+rnd(-8,8),sy,over,Z.fall,P);
  if(!over)return;
  p+=o.rate;fill.style.width=Math.min(100,p*100)+'%';
  if(o.prog)o.prog(p,P);else P.soil(1,o.wetSoil?Math.min(1,p):0);
  if(o.snd)o.snd();
  if(p>=1){done=true;held=false;tool.remove();water(false);clearInterval(iv);IV.delete(iv);o.fin&&o.fin(P);ding();P.perk();P.hop();burstStars(cx,cy,18);setTimeout(()=>win(),1100)}
 }

 MILO.leaves=positions.map((p,i)=>({...p,color:colors[i],angle:-55+miloRand(111),stick:count===4&&i===3&&Math.random()<.42,done:false}));
 const ui=miloMakeWorld('Togliamo le foglioline!',`0 di ${count} raccolte · Tocca oppure trascina nel cestino`,showMiloIntro);
 const layer=ui.svg.querySelector('#milo-leaves');
 const basket=ui.svg.querySelector('#milo-basket');
 const ns='http://www.w3.org/2000/svg';
 let finished=0,hintTimer=null,active=false;
 const basketX=355,basketY=376;
 const scheduleHint=()=>{clearTimeout(hintTimer);hintTimer=setTimeout(()=>{
  if(!ui.world.isConnected || active)return;
  const l=layer.querySelector('.milo-leaf:not([data-done])');
  if(l){l.querySelector('.milo-leaf-body').animate([{opacity:1},{opacity:.55},{opacity:1}],{duration:650,iterations:2});}
 },6000)};
 function completeLeaf(leaf,g,i,from){
  if(leaf.done)return;
  leaf.done=true;g.dataset.done='1';g.style.pointerEvents='none';active=true;
  basket.classList.add('active');pop();miloReact(ui,leaf.tag);
  // Posizione e rotazione nello stesso sistema di coordinate SVG: nessun salto nell'angolo.
  const tx=basketX-2+miloRand(13)-6,ty=basketY+3;
  const sx=from.x,sy=from.y,start=performance.now();
  const duration=620;let last=0;
  const body=g.querySelector('.milo-leaf-body');
  function frame(now){
   if(!g.isConnected)return;
   const t=Math.min(1,(now-start)/duration),ease=t*t*(3-2*t);
   const xx=sx+(tx-sx)*ease;
   const yy=sy+(ty-sy)*ease-46*Math.sin(Math.PI*t);
   const spin=leaf.angle+430*t;
   g.setAttribute('transform',`translate(${xx.toFixed(2)} ${yy.toFixed(2)})`);
   body.setAttribute('transform',`rotate(${spin.toFixed(2)}) scale(${(1-.70*ease).toFixed(3)})`);
   g.style.opacity=t<.85?'1':String(Math.max(0,1-(t-.85)/.15));
   if(t<1){requestAnimationFrame(frame);return}
   g.remove();active=false;basket.classList.remove('active');
   finished++;
   ui.heading.querySelector('small').textContent=`${finished} di ${count} raccolte · Bravo Milo!`;
   if(finished===count){ding();miloCelebrate(ui);setTimeout(()=>{if(ui.world.isConnected)showMiloComplete()},1200)}
   else scheduleHint();
  }

  g.setAttribute('role','button');g.setAttribute('tabindex','0');

  g.innerHTML=`<g class="milo-leaf-body" transform="rotate(${leaf.angle})">${miloLeafMarkup(leaf)}</g><circle r="36" fill="transparent"/>`;
  layer.appendChild(g);
  let sx=0,sy=0,downX=0,downY=0,drag=false;
  g.addEventListener('pointerdown',e=>{
   if(leaf.done || active)return;
   e.preventDefault();e.stopPropagation();clearTimeout(hintTimer);
   g.setPointerCapture(e.pointerId);
   const p=miloPoint(ui.svg,e);sx=p.x;sy=p.y;downX=leaf.x;downY=leaf.y;drag=false;

   }
  });
  g.addEventListener('pointerup',e=>{
   if(leaf.done)return;
   basket.classList.remove('active');
   const transform=g.getAttribute('transform');
   const match=transform.match(/translate\(([-\d.]+)[ ,]([-\d.]+)\)/);
   const from=match?{x:+match[1],y:+match[2]}:{x:leaf.x,y:leaf.y};
   completeLeaf(leaf,g,i,from);
  });
